spring:
  application:
    name: ms-admin-rabbit
  profiles:
    active: demo

  # --- Conexion al broker RabbitMQ ------------------------------------------
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASS:admin123}
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # Confirmacion explicita por parte de cada consumidor
        acknowledge-mode: manual
        prefetch: 1
        concurrency: 1
        max-concurrency: 3

server:
  port: 8084

logging:
  level:
    root: INFO
    cl.innovatech: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{30} - %msg%n"

# =============================================================================
# CONFIGURACION PROPIA DE LA APLICACION
# =============================================================================
app:

  # ---------------------------------------------------------------------------
  # SEGURIDAD - Microsoft Entra External ID
  # ---------------------------------------------------------------------------
  security:
    tenant-id: 195a9a2b-7458-48e9-b93d-8667f389ab8c
    issuer-uri: https://195a9a2b-7458-48e9-b93d-8667f389ab8c.ciamlogin.com/195a9a2b-7458-48e9-b93d-8667f389ab8c/
    jwk-set-uri: https://195a9a2b-7458-48e9-b93d-8667f389ab8c.ciamlogin.com/195a9a2b-7458-48e9-b93d-8667f389ab8c/discovery/v2.0/keys
    audiences: api://6fd02921-82d8-4677-9495-8d0b20f0ac07

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

  # ===========================================================================
  # MENSAJERIA - NOMBRES DE LA TOPOLOGIA
  # ---------------------------------------------------------------------------
  # Ningun nombre de cola, exchange, routing key o DLQ se escribe suelto dentro
  # del codigo Java. Todos se declaran aqui y se inyectan mediante la clase
  # MensajeriaProperties (@ConfigurationProperties) o con placeholders.
  # Este bloque es identico en los cuatro microservicios: es el contrato de
  # nombres compartido por todo el sistema.
  # ===========================================================================
  rabbit:

    # --- Exchanges -----------------------------------------------------------
    exchanges:
      pedidos: innovatech.pedidos.exchange   # eventos del dominio de pedidos (topic)
      alertas: innovatech.alertas.direct     # avisos operativos de un solo destinatario (direct)
      dlx: innovatech.dlx                    # Dead Letter Exchange (topic)

    # --- Routing keys --------------------------------------------------------
    routing-keys:
      pedido-creado: pedido.creado           # evento que publica ms-pedidos
      alerta-stock-bajo: alerta.stock.bajo   # aviso que publica ms-productos
      dlq-notificaciones: dlq.notificaciones
      dlq-documentos: dlq.documentos
      dlq-inventario: dlq.inventario
      dlq-alertas: dlq.alertas

    # --- Colas de trabajo ----------------------------------------------------
    queues:
      notificaciones: pedidos.notificaciones.queue
      documentos: pedidos.documentos.queue
      inventario: pedidos.inventario.queue
      alertas-stock: alertas.stock.queue
      # --- Dead Letter Queues: una por dominio, para no mezclar las fallas ---
      notificaciones-dlq: pedidos.notificaciones.dlq
      documentos-dlq: pedidos.documentos.dlq
      inventario-dlq: pedidos.inventario.dlq
      alertas-stock-dlq: alertas.stock.dlq

    # --- Auditoria de las Dead Letter Queues ---------------------------------
    # Con el valor en true, los consumidores de auditoria leen cada DLQ, dejan
    # el detalle del descarte en el log y en la bitacora, y confirman. Ponerlo
    # en false deja los mensajes acumulados en la cola sin procesar.
    auditoria-dlq: true

    # --- Politica de reintentos del consumidor -------------------------------
    reintentos:
      max-intentos: 2   # 1 intento original + 1 reintento; luego se envia a DLQ
