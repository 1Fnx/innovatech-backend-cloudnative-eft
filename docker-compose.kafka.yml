# Apache Kafka - cluster de 3 brokers sobre un ensemble ZooKeeper de 3 nodos.
#
# Independiente de docker-compose.yml (RabbitMQ): redes y volumenes propios,
# se levantan por separado.
#
#   docker compose -f docker-compose.kafka.yml up -d
#   docker compose -f docker-compose.kafka.yml down        (-v borra los datos)
#
# Puertos publicados
#   2181, 2182, 2183   clientes ZooKeeper
#   9092, 9093, 9094   brokers, uno por nodo
#   8080               Kafka UI
#
# Puertos internos
#   2888 / 3888        sincronizacion y eleccion de lider entre nodos ZooKeeper
#   29092              listener INTERNAL entre contenedores
#
# El heap de cada JVM va fijado a mano: por defecto Kafka reserva 1 GB por
# broker y ZooKeeper 512 MB por nodo, mas de 4 GB solo en heap.

services:

  # ---------------------------------------------------------------------------
  # Ensemble ZooKeeper
  #
  # Guarda los metadatos del cluster (topicos, particiones, lideres, replicas
  # sincronizadas). Los brokers se coordinan a traves de el, no entre si.
  #
  # El ensemble decide por mayoria, de ahi el numero impar de nodos: con 3 la
  # mayoria es 2 y se tolera la caida de uno. Con 2 nodos la mayoria seguiria
  # siendo 2 y perder uno detendria el cluster.
  #
  # ZOOKEEPER_SERVERS es identica en los tres; lo unico que cambia entre nodos
  # es ZOOKEEPER_SERVER_ID.
  # ---------------------------------------------------------------------------

  zookeeper-1:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: innovatech-zookeeper-1
    hostname: zookeeper-1
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    volumes:
      - zk1_data:/var/lib/zookeeper/data
      - zk1_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost:2181 5 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks: [innovatech-kafka]

  zookeeper-2:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: innovatech-zookeeper-2
    hostname: zookeeper-2
    ports:
      - "2182:2181"
    environment:
      ZOOKEEPER_SERVER_ID: 2
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    volumes:
      - zk2_data:/var/lib/zookeeper/data
      - zk2_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost:2181 5 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks: [innovatech-kafka]

  zookeeper-3:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: innovatech-zookeeper-3
    hostname: zookeeper-3
    ports:
      - "2183:2181"
    environment:
      ZOOKEEPER_SERVER_ID: 3
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    volumes:
      - zk3_data:/var/lib/zookeeper/data
      - zk3_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost:2181 5 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks: [innovatech-kafka]

  # ---------------------------------------------------------------------------
  # Brokers
  #
  # Dos listeners por broker, porque los clientes viven en dos redes:
  #   INTERNAL  kafka-N:29092    replicacion entre brokers y Kafka UI
  #   EXTERNAL  localhost:909N   aplicaciones Spring Boot fuera de Docker
  # Con un solo listener uno de los dos grupos no puede conectar: "kafka-1" no
  # resuelve desde el host, y "localhost" dentro de un contenedor apunta al
  # propio contenedor.
  #
  # MIN_INSYNC_REPLICAS 2 con replicacion 3: una escritura acks=all se confirma
  # cuando 2 replicas la tienen, de modo que se tolera la caida de un broker sin
  # bloquear la escritura. En 1 se aceptarian escrituras con una sola copia viva.
  #
  # AUTO_CREATE_TOPICS_ENABLE false: un topico mal escrito falla de forma
  # visible en vez de crearse solo con 1 particion y 1 replica.
  # ---------------------------------------------------------------------------

  kafka-1:
    image: confluentinc/cp-kafka:7.6.1
    container_name: innovatech-kafka-1
    hostname: kafka-1
    depends_on:
      zookeeper-1: {condition: service_healthy}
      zookeeper-2: {condition: service_healthy}
      zookeeper-3: {condition: service_healthy}
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - kafka1_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 45s
    networks: [innovatech-kafka]

  kafka-2:
    image: confluentinc/cp-kafka:7.6.1
    container_name: innovatech-kafka-2
    hostname: kafka-2
    depends_on:
      zookeeper-1: {condition: service_healthy}
      zookeeper-2: {condition: service_healthy}
      zookeeper-3: {condition: service_healthy}
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - kafka2_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9093 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 45s
    networks: [innovatech-kafka]

  kafka-3:
    image: confluentinc/cp-kafka:7.6.1
    container_name: innovatech-kafka-3
    hostname: kafka-3
    depends_on:
      zookeeper-1: {condition: service_healthy}
      zookeeper-2: {condition: service_healthy}
      zookeeper-3: {condition: service_healthy}
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://localhost:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - kafka3_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9094 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 45s
    networks: [innovatech-kafka]

  # ---------------------------------------------------------------------------
  # Kafka UI
  #
  # Corre dentro de la red de Docker, por eso usa el listener INTERNAL.
  # DYNAMIC_CONFIG_ENABLED habilita las operaciones de escritura (crear topicos,
  # cambiar su configuracion, borrarlos); sin ella la consola es de solo lectura.
  # ---------------------------------------------------------------------------

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: innovatech-kafka-ui
    depends_on:
      kafka-1: {condition: service_healthy}
      kafka-2: {condition: service_healthy}
      kafka-3: {condition: service_healthy}
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: innovatech
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      DYNAMIC_CONFIG_ENABLED: "true"
      JAVA_OPTS: "-Xms128m -Xmx384m"
    networks: [innovatech-kafka]

networks:
  innovatech-kafka:
    name: innovatech-kafka
    driver: bridge

volumes:
  zk1_data:
  zk1_log:
  zk2_data:
  zk2_log:
  zk3_data:
  zk3_log:
  kafka1_data:
  kafka2_data:
  kafka3_data:
